name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q G5ray.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.2.11394342" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build sing-box libbox.aar
        run: |
          git clone --depth 1 --branch v1.10.7 https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          make lib_android
          mkdir -p $GITHUB_WORKSPACE/G5ray/app/libs
          cp "$(find . -name libbox.aar | head -n1)" $GITHUB_WORKSPACE/G5ray/app/libs/libbox.aar

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: G5ray
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: G5ray-apk
          path: G5ray/app/build/outputs/apk/release/*.apk
